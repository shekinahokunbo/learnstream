name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write  # required for the OIDC deploy role

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src infra tests
      - name: Unit tests
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=85

  synth:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt
      - run: npm install -g aws-cdk
      - name: Synthesize CloudFormation
        working-directory: infra
        run: cdk synth --quiet

  deploy:
    runs-on: ubuntu-latest
    needs: synth
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt
      - run: npm install -g aws-cdk
      # Set AWS_DEPLOY_ROLE_ARN in repo secrets after running:
      #   aws iam create-open-id-connect-provider ... (see README, "Deploy")
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy
        working-directory: infra
        run: cdk deploy --require-approval never
